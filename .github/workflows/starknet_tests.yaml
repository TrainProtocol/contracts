name: Starknet Tests

on:
  push:
    branches: [ main, main-add-starknet ]
    paths:
      - 'chains/starknet/**'
  pull_request:
    branches: [ main, main-add-starknet ]
    paths:
      - 'chains/starknet/**'

jobs:
  contracts:
    name: Build & test (snforge)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.14.0"

      - name: Install Starknet Foundry
        uses: foundry-rs/setup-snfoundry@v3
        with:
          starknet-foundry-version: "0.57.0"

      - name: Build contracts
        working-directory: chains/starknet
        run: scarb build

      - name: Run tests
        working-directory: chains/starknet
        run: snforge test

  scripts:
    name: Typecheck scripts (tsc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: chains/starknet/scripts
        run: npm ci

      - name: Typecheck (no emit)
        working-directory: chains/starknet/scripts
        run: npx tsc --noEmit
